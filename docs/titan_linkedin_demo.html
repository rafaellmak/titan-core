<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Titan Core V6 - LinkedIn Demo</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal {
            width: 800px;
            height: 500px;
            background-color: #010409;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            overflow-y: auto;
            position: relative;
        }
        .line { margin-bottom: 8px; line-height: 1.4; min-height: 1.4em; }
        .prompt { color: #58a6ff; font-weight: bold; }
        .command { color: #f0f6f8; }
        .output { color: #8b949e; }
        .success { color: #3fb950; }
        .error { color: #f85149; }
        .ai-bot { color: #d2a8ff; font-weight: bold; }
        .highlight { color: #ff7b72; font-weight: bold; }
        
        #cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #c9d1d9;
            margin-left: 5px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: #161b22;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #30363d;
            border-radius: 6px 6px 0 0;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }
        
        .overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid #00E5FF;
            padding: 10px 20px;
            border-radius: 4px;
            color: #00E5FF;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="overlay">TITAN CORE V6 - AI ASSISTED ENGINEERING</div>
    <div id="terminal">
        <div class="header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px; font-size: 12px; color: #8b949e;">ubuntu@titan-dev: ~/project</span>
        </div>
        <div id="content" style="margin-top: 20px;"></div>
        <span id="current-line"></span><span id="cursor"></span>
    </div>

    <script>
        const content = document.getElementById('content');
        const currentLine = document.getElementById('current-line');
        const terminal = document.getElementById('terminal');

        const script = [
            { type: 'prompt', text: 'titan info' },
            { type: 'output', text: '<span class="success">✅ Workspace detectado: YOCTO</span>' },
            { type: 'output', text: '📂 Diretório: /home/ubuntu/titan_project' },
            { type: 'pause', time: 1000 },
            { type: 'prompt', text: 'titan llm-assist "me ajude com o erro nothing provides no build.log" --provider offline' },
            { type: 'output', text: '📦 Usando motor de mock offline local...' },
            { type: 'output', text: '<span class="ai-bot">🤖 Sugestão do Assistente:</span> A dependência do recipe pode estar ausente ou bloqueada no BBMASK.' },
            { type: 'output', text: '➡️ Comando Titan mapeado: <span class="highlight">titan diagnose build.log</span>' },
            { type: 'pause', time: 800 },
            { type: 'output', text: '⚠️ Deseja executar o comando sugerido acima? (y/N): y' },
            { type: 'output', text: '🚀 Executando comando sugerido...' },
            { type: 'output', text: '<span class="error">[ERROR] YOC-001 (Linha 3) - Dependência não encontrada no cache de recipes.</span>' },
            { type: 'output', text: '💡 Verifique se a layer que contém \'openssl-native\' está no bblayers.conf.' },
            { type: 'pause', time: 1500 },
            { type: 'prompt', text: 'titan action append-conf "EXTRA_IMAGE_FEATURES += \'debug-tweaks\'"' },
            { type: 'output', text: '<span class="success">✅ Conteúdo adicionado ao local.conf com sucesso.</span>' },
            { type: 'pause', time: 1000 },
            { type: 'prompt', text: 'titan recipe deps example' },
            { type: 'output', text: '🌳 Grafo de Dependências para: example' },
            { type: 'output', text: '└── example' },
            { type: 'output', text: '<span class="success">✨ Teste finalizado. Titan Core V6 pronto para produção.</span>' }
        ];

        async function typeText(text, element, speed = 50) {
            for (let i = 0; i < text.length; i++) {
                element.innerHTML += text.charAt(i);
                await new Promise(r => setTimeout(r, speed));
                terminal.scrollTop = terminal.scrollHeight;
            }
        }

        async function run() {
            for (const step of script) {
                if (step.type === 'prompt') {
                    const line = document.createElement('div');
                    line.className = 'line';
                    line.innerHTML = '<span class="prompt">ubuntu@titan-dev:~$ </span>';
                    const cmdSpan = document.createElement('span');
                    cmdSpan.className = 'command';
                    line.appendChild(cmdSpan);
                    content.appendChild(line);
                    await typeText(step.text, cmdSpan, 70);
                    await new Promise(r => setTimeout(r, 500));
                } else if (step.type === 'output') {
                    const line = document.createElement('div');
                    line.className = 'line output';
                    line.innerHTML = step.text;
                    content.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                    await new Promise(r => setTimeout(r, 300));
                } else if (step.type === 'pause') {
                    await new Promise(r => setTimeout(r, step.time));
                }
            }
        }

        run();
    </script>
</body>
</html>
